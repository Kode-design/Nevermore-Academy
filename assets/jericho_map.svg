<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
  <rect width="800" height="600" fill="#2d3436" />

  <!-- Forest -->
  <path d="M0,0 L800,0 L800,600 L0,600 Z" fill="#1e272e" />
  <circle cx="100" cy="100" r="150" fill="#0b3d0b" opacity="0.5" />
  <circle cx="700" cy="500" r="200" fill="#0b3d0b" opacity="0.5" />

  <!-- Roads -->
  <path d="M400,300 L200,500" stroke="#636e72" stroke-width="20" /> <!-- Road to Diner/Town -->
  <path d="M400,300 L600,100" stroke="#636e72" stroke-width="20" /> <!-- Road to Nevermore -->
  <path d="M400,300 L500,500" stroke="#636e72" stroke-width="15" stroke-dasharray="20,10" /> <!-- Old Dirt Road to Tunnels -->

  <!-- Jericho Town (Left Bottom) -->
  <rect x="150" y="450" width="100" height="100" fill="#b2bec3" />
  <text x="160" y="560" font-family="monospace" fill="white" font-size="16">JERICHO</text>

  <!-- Nevermore Academy (Right Top) -->
  <path d="M550,50 L650,50 L650,150 L550,150 Z" fill="#2d3436" stroke="black" stroke-width="2" />
  <rect x="580" y="20" width="40" height="30" fill="#2d3436" /> <!-- Tower -->
  <text x="560" y="170" font-family="monospace" fill="white" font-size="16">NEVERMORE</text>

  <!-- Tunnels (Right Bottom) -->
  <circle cx="500" cy="500" r="30" fill="#000" stroke="#444" stroke-width="5" />
  <text x="460" y="550" font-family="monospace" fill="#aaa" font-size="14">OLD TUNNELS</text>

  <!-- Weathervane Diner Icon -->
  <rect x="180" y="480" width="20" height="20" fill="#d63031" />

</svg>
