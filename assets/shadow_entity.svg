<svg width="64" height="100" xmlns="http://www.w3.org/2000/svg">
  <!-- A jagged, smoke-like looming figure -->
  <defs>
    <radialGradient id="grad1" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" style="stop-color:rgb(20,20,20);stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:rgb(0,0,0);stop-opacity:0" />
    </radialGradient>
  </defs>

  <!-- Main Body (distorted shape) -->
  <path d="M20,90 Q10,70 15,50 Q10,30 25,10 Q40,0 55,20 Q60,40 50,60 Q60,80 40,95 Z" fill="#111" opacity="0.8" />

  <!-- "Eyes" or lighter patches (subtle) -->
  <circle cx="30" cy="30" r="2" fill="#330033" opacity="0.6" />
  <circle cx="45" cy="35" r="2" fill="#330033" opacity="0.6" />

  <!-- Wisps -->
  <path d="M15,50 Q5,45 10,35" stroke="#111" stroke-width="2" fill="none" />
  <path d="M50,60 Q60,55 55,45" stroke="#111" stroke-width="2" fill="none" />
</svg>
